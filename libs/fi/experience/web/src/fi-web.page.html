<header class="masthead">
  <a routerLink="/fi/LUMA" class="wordmark"
    ><span aria-hidden="true">◒</span> Fieldnotes
    <small>an investing sandbox</small></a
  ><app-theme-picker />
</header>
<main class="workspace">
  <div class="page-top">
    <div>
      <p class="eyebrow">Discover / Instrument detail</p>
      <p class="fi-note">Two fictional ideas. Room to explore.</p>
    </div>
    <nav aria-label="Synthetic instruments">
      <a
        routerLink="/fi/LUMA"
        [attr.aria-current]="store.symbol() === 'LUMA' ? 'page' : null"
        >LUMA</a
      ><a
        routerLink="/fi/TIDE"
        [attr.aria-current]="store.symbol() === 'TIDE' ? 'page' : null"
        >TIDE</a
      >
    </nav>
  </div>
  <app-instrument-status
    [status]="store.status()"
    [symbol]="store.symbol()"
    [error]="store.error()"
    (retry)="store.load(store.symbol())"
  />
  <div class="fi-layout">
    @if (store.instrument(); as instrument) { @if (store.stats(); as stats) {
    <div class="fi-stack">
      <app-instrument-overview
        class="fi-card"
        [instrument]="instrument"
        [stats]="stats"
      />
      <app-instrument-chart
        class="fi-card"
        [series]="store.series()"
        [range]="store.range()"
        (rangeChange)="store.setRange($event)"
      />
      <app-instrument-details
        class="fi-card"
        [instrument]="instrument"
        [stats]="stats"
      />
    </div>
    }}
    <aside aria-label="Demo trade ticket">
      <app-demo-trade
        [symbol]="store.symbol()"
        [price]="store.stats()?.price ?? null"
      />
    </aside>
  </div>
  <footer>
    <p class="fi-note">
      PUBLIC LEARNING EXAMPLE · Synthetic data. No brokerage service.
    </p>
    <app-demo-scenarios (scenario)="store.load(store.symbol(), $event)" /><a
      routerLink="/"
      >Back to all demos</a
    >
  </footer>
</main>
